persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# ห้าม anonymous เด็ดขาด เพราะจะ expose ผ่าน public domain
allow_anonymous false
password_file /mosquitto/config/passwd

# Listener ปกติ - ใช้ภายใน docker network (Telegraf, Node-RED เชื่อมตรงนี้)
listener 1883
protocol mqtt

# Listener แบบ WebSocket - สำหรับ ESP32 ผ่าน Cloudflare Tunnel (wss://)
listener 9001
protocol websockets
