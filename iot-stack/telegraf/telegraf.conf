[agent]
  interval = "10s"
  flush_interval = "10s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["sensors/#"]
  username = "$MQTT_USER"
  password = "$MQTT_PASSWORD"
  data_format = "json"
  name_override = "dht22"

  # เพิ่ม tag จาก topic เพื่อแยกอุปกรณ์ในอนาคต (ถ้ามีหลายตัว)
  # เช่น topic: sensors/room1/dht22 -> tag device=room1
  topic_tag = "topic"

[[outputs.influxdb_v2]]
  urls = ["https://influxdb.milkbor.me"]
  token = "$INFLUX_TOKEN"
  organization = "$INFLUX_ORG"
  bucket = "$INFLUX_BUCKET"
